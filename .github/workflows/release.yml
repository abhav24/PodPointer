name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build disk image
        run: scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/PodPointer-$GITHUB_REF_NAME.dmg"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" \
              --title "PodPointer $GITHUB_REF_NAME" \
              --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
          fi
